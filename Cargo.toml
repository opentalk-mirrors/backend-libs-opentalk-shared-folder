[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
description = "NextCloud client library embedded in OpenTalk"
documentation = "https://docs.rs/opentalk-nextcloud-client"
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-nextcloud-client"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-nextcloud-client"
version = "0.3.0"

[dependencies]
chrono = "0.4"
derive_more = { version = "2.0", features = [
  "from",
  "into",
  "from_str",
  "as_ref",
  "display",
] }
log = "0.4"
reqwest = { version = "0.13", features = ["json"] }
reqwest_dav = "0.3.0"
serde = { version = "1", features = ["derive"] }
snafu = "0.8"
strum = { version = "0.27", features = ["derive"] }
url = "2"

[dev-dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
