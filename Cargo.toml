[workspace]
members = [
  "crates/opentalk-nextcloud-client",
  "crates/opentalk-opencloud-client",
]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
repository = "https://git.opentalk.dev/opentalk/backend/libs/opentalk-shared-folder"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "2.0", features = [
  "as_ref",
  "display",
  "from",
  "from_str",
  "into",
] }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", features = ["json"] }
reqwest_dav = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
